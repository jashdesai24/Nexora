version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: nexora_user
      POSTGRES_PASSWORD: nexora_password
      POSTGRES_DB: nexora_db
    ports:
      - "5433:5432"
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora_user -d nexora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - nexora_redisdata:/data

  nexora-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora_backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FRONTEND_URL=http://localhost:80
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=postgresql://nexora_user:nexora_password@db:5432/nexora_db?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nexora-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora_worker
    command: ["npm", "run", "start:worker"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://nexora_user:nexora_password@db:5432/nexora_db?schema=public
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nexora-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3001
    container_name: nexora_frontend
    ports:
      - "80:80"
    depends_on:
      - nexora-backend

volumes:
  nexora_pgdata:
  nexora_redisdata:
