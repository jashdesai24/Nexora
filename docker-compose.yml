version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: nexora_user
      POSTGRES_PASSWORD: nexora_password
      POSTGRES_DB: nexora_db
    ports:
      - "5432:5432"
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data

  nexora-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora_backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FRONTEND_URL=http://localhost:80
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # If using SQLite locally, we can mount a volume for dev.db
    volumes:
      - nexora_db_data:/app/prisma

  nexora-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3001
    container_name: nexora_frontend
    ports:
      - "80:80"
    depends_on:
      - nexora-backend

volumes:
  nexora_pgdata:
  nexora_db_data:
